services:
  backend:
    build:
      context: ./services
    environment:
      APP_MODE: ${APP_MODE:?Run scripts/setup-env.mjs first}
      API_PORT: ${API_PORT:?}
      SECRET_KEY: ${SECRET_KEY:?}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:?}
      TINYDB_PATH: ${TINYDB_PATH:?}
      DATABASE_URL: ${DATABASE_URL:?}
      SUPPLIERS_DB_PATH: ${SUPPLIERS_DB_PATH:?}
      SEED_ON_START: ${SEED_ON_START:?}
      ENABLE_DEMO: ${ENABLE_DEMO:?}
      DEMO_EMAIL: ${DEMO_EMAIL:?}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?}
    ports:
      - "${HOST_BIND:?}:${API_HOST_PORT:?}:${API_PORT:?}"
    volumes:
      - ./services/api:/app/api
      - backend-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['API_PORT'] + '/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [platform]
    init: true
  interfaces:
    build:
      context: ./uis
      target: development
    environment:
      APP_MODE: ${APP_MODE:?}
      WEBSITE_PORT: ${WEBSITE_PORT:?}
      BACKOFFICE_PORT: ${BACKOFFICE_PORT:?}
      BACKEND_API_URL: ${BACKEND_API_URL:?}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}
      NEXT_PUBLIC_INVENTORY_API_URL: ${NEXT_PUBLIC_INVENTORY_API_URL:?}
      NEXT_PUBLIC_BACKOFFICE_URL: ${NEXT_PUBLIC_BACKOFFICE_URL:?}
      NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED:?}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:?}
      NEXT_ALLOWED_DEV_ORIGINS: ${NEXT_ALLOWED_DEV_ORIGINS:?}
    ports:
      - "${HOST_BIND:?}:${WEBSITE_HOST_PORT:?}:${WEBSITE_PORT:?}"
      - "${HOST_BIND:?}:${BACKOFFICE_HOST_PORT:?}:${BACKOFFICE_PORT:?}"
    volumes:
      - ./uis/website:/app/website
      - ./uis/backoffice:/app/backoffice
      - /app/website/node_modules
      - /app/backoffice/node_modules
      - /app/website/.next
      - /app/backoffice/.next
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([process.env.WEBSITE_PORT,process.env.BACKOFFICE_PORT].map(port=>fetch('http://127.0.0.1:'+port+'/').then(response=>{if(!response.ok)throw Error('HTTP '+response.status)}))).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 60s
    networks: [platform]
    init: true
volumes:
  backend-data:
networks:
  platform:
    name: nexova-platform